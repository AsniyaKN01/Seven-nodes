<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7Nodes Auth</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>7Nodes User Management</h1>
      <div id="auth-status"></div>
    </header>

    <main>
      <div id="login-section" class="form-section">
        <h2>Login</h2>
        <form id="login-form">
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <label><input type="checkbox" name="remember_me"> Remember me</label>
          <button type="submit">Login</button>
        </form>
        <p id="login-error" class="error"></p>
      </div>

      <div id="signup-section" class="form-section">
        <h2>Sign Up</h2>
        <form id="signup-form">
          <input type="text" name="first_name" placeholder="First name" required>
          <input type="text" name="last_name" placeholder="Last name" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password (min 8 chars)" required>
          <select name="organisation_type" required>
            <option value="">Select organisation type</option>
            <option value="Pharmaceutical Company">Pharmaceutical Company</option>
            <option value="Biotech Startup">Biotech Startup</option>
            <option value="Academic / Research Institution">Academic / Research Institution</option>
            <option value="Hospital / Clinical Centre">Hospital / Clinical Centre</option>
            <option value="CRO / Contract Research">CRO / Contract Research</option>
            <option value="Other">Other</option>
          </select>
          <label><input type="checkbox" name="remember_me"> Remember me</label>
          <button type="submit">Sign Up</button>
        </form>
        <p id="signup-error" class="error"></p>
      </div>

      <div id="dashboard" class="form-section" style="display: none;">
        <h2>Welcome</h2>
        <p id="user-info"></p>
        <button id="logout-btn">Logout</button>
      </div>
    </main>
  </div>
  <script src="auth.js"></script>
</body>
</html>
